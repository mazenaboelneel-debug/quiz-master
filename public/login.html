<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔐 تسجيل الدخول | Quiz Master</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="auth-style.css">
  <link rel="stylesheet" href="theme.css">
<script type="module" src="theme.js"></script>
</head>
<body>
  <div id="bg-layer"></div>
  <div id="bg-overlay"></div>

  <section class="screen active auth-screen">
    <h1>🎯 Quiz Master</h1>
    <p>سجّل دخولك عشان تبدأ اللعب</p>

    <input type="email" id="email" class="name-input" placeholder="الإيميل">
    <input type="password" id="password" class="name-input" placeholder="كلمة السر">

    <div id="error-msg" class="error-msg"></div>

    <button id="login-btn" class="btn-primary">🔐 تسجيل دخول</button>

    <div class="divider"><span>أو</span></div>

    <button id="google-btn" class="btn-google">
      <svg width="20" height="20" viewBox="0 0 48 48">
        <path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/>
        <path fill="#FF3D00" d="M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/>
        <path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238C29.211 35.091 26.715 36 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/>
        <path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303c-.792 2.237-2.231 4.166-4.087 5.571.001-.001.002-.001.003-.002l6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/>
      </svg>
      الدخول بحساب Google
    </button>

    <p class="switch-link">
      مش عندك حساب؟
      <a href="register.html">اعمل حساب جديد</a>
    </p>
  </section>

  <script type="module">
    import { loginWithEmail, loginWithGoogle, translateAuthError, watchAuth } from './auth.js';

    watchAuth(user => {
      if (user) window.location.href = 'index.html';
    });

    const emailInput = document.getElementById('email');
    const passInput  = document.getElementById('password');
    const errorMsg   = document.getElementById('error-msg');
    const loginBtn   = document.getElementById('login-btn');
    const googleBtn  = document.getElementById('google-btn');

    const showError = (msg) => { errorMsg.textContent = msg; errorMsg.style.display = 'block'; };
    const clearError = () => { errorMsg.style.display = 'none'; };

    loginBtn.addEventListener('click', async () => {
      clearError();
      const email = emailInput.value.trim();
      const pass  = passInput.value;
      if (!email || !pass) return showError('لازم تملا الإيميل وكلمة السر');

      loginBtn.disabled = true;
      loginBtn.textContent = '⏳ جاري...';

      try {
        await loginWithEmail(email, pass);
      } catch (err) {
        showError(translateAuthError(err.code));
        loginBtn.disabled = false;
        loginBtn.textContent = '🔐 تسجيل دخول';
      }
    });

    googleBtn.addEventListener('click', async () => {
      clearError();
      googleBtn.disabled = true;
      try {
        await loginWithGoogle();
      } catch (err) {
        showError(translateAuthError(err.code));
        googleBtn.disabled = false;
      }
    });

    [emailInput, passInput].forEach(inp => {
      inp.addEventListener('keypress', e => {
        if (e.key === 'Enter') loginBtn.click();
      });
    });
  </script>
</body>
</html>
